changelog:
  exclude:
    labels:
      - "skip changelog"
  categories:
    - title: "breaking changes"
      labels:
        - "breaking change"
    - title: "features"
      labels:
        - "enhancement"
    - title: "fixes"
      labels:
        - "bug"
    - title: "dependencies"
      labels:
        - "dependencies"
    - title: "documentation"
      labels:
        - "documentation"
    - title: "other changes"
      labels:
        - "*"
