name: bug report
description: report a reproducible defect
title: "[bug] "
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        thank you for reporting the issue. remove credentials and private data from every field and attachment.
  - type: input
    id: version
    attributes:
      label: affected version
      placeholder: exact project version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: environment
      description: include platform, runtime, loader, and dependency versions that apply
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: reproduction steps
      description: provide the smallest reliable sequence that reproduces the problem
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: logs and evidence
      description: attach sanitized logs, crash reports, screenshots, configuration, or a minimal reproduction
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: checks
      options:
        - label: i searched for an existing issue
          required: true
        - label: i removed credentials, tokens, addresses, and private data
          required: true
