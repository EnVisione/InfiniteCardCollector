name: feature request
description: propose a focused improvement
title: "[feature] "
labels: ["enhancement", "needs triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: problem
      description: explain the user or maintainer problem this should solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: proposed behavior
      description: describe the observable behavior and important edge cases
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: alternatives considered
  - type: textarea
    id: acceptance
    attributes:
      label: acceptance criteria
      description: list concrete outcomes that prove the request is complete
    validations:
      required: true
