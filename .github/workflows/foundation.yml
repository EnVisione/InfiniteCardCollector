name: foundation

on:
  pull_request:
    paths:
      - ".github/workflows/foundation.yml"
      - ".gitignore"
      - ".styluaignore"
      - "README.md"
      - "build/.gitkeep"
      - "config/**"
      - "default.project.json"
      - "docs/**"
      - "lune/**"
      - "roblox.yml"
      - "rokit.toml"
      - "scripts/**"
      - "selene.toml"
      - "src/**"
      - "stylua.toml"
      - "tests/**"
  push:
    branches:
      - main
      - "envy/core-phase-*"
    paths:
      - ".github/workflows/foundation.yml"
      - ".gitignore"
      - ".styluaignore"
      - "README.md"
      - "build/.gitkeep"
      - "config/**"
      - "default.project.json"
      - "docs/**"
      - "lune/**"
      - "roblox.yml"
      - "rokit.toml"
      - "scripts/**"
      - "selene.toml"
      - "src/**"
      - "stylua.toml"
      - "tests/**"
  workflow_dispatch:

concurrency:
  group: foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: foundation linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ICC_CI: "true"
      ROKIT_ROOT: ${{ github.workspace }}/build/rokit
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: restore pinned tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.ROKIT_ROOT }}
          key: foundation-tools-${{ runner.os }}-${{ hashFiles('rokit.toml', 'config/tool-artifacts.json') }}

      - name: bootstrap pinned tools
        shell: bash
        run: |
          bash scripts/bootstrap-tools.sh
          echo "$ROKIT_ROOT/bin" >> "$GITHUB_PATH"

      - name: verify foundation
        shell: bash
        run: |
          lune run ci 2>&1 | tee build/ci-transcript.txt

      - name: upload bounded evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: foundation-linux-${{ github.sha }}
          path: |
            build/artifact-manifest.json
            build/ci-transcript.txt
            build/infinite-card-collector.rbxlx
            build/infinite-card-collector.rbxlx.sha256
            build/infinite-card-collector.rbxlx.sha512
            build/infinite-card-collector.sourcemap.json
          if-no-files-found: ignore
          retention-days: 3

  windows:
    name: foundation windows
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      ICC_CI: "true"
      ROKIT_ROOT: ${{ github.workspace }}/build/rokit
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: restore pinned tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.ROKIT_ROOT }}
          key: foundation-tools-${{ runner.os }}-${{ hashFiles('rokit.toml', 'config/tool-artifacts.json') }}

      - name: bootstrap pinned tools
        shell: pwsh
        run: |
          .\scripts\bootstrap-tools.ps1
          $env:ROKIT_ROOT + "\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: verify foundation
        shell: pwsh
        run: |
          lune run ci 2>&1 | Tee-Object -FilePath build/ci-transcript.txt
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      - name: upload bounded evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: foundation-windows-${{ github.sha }}
          path: |
            build/artifact-manifest.json
            build/ci-transcript.txt
            build/infinite-card-collector.rbxlx
            build/infinite-card-collector.rbxlx.sha256
            build/infinite-card-collector.rbxlx.sha512
            build/infinite-card-collector.sourcemap.json
          if-no-files-found: ignore
          retention-days: 3
